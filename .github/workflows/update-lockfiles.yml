name: Check native lockfiles

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check CocoaPods dependency resolutions
    runs-on: macos-26
    timeout-minutes: 15
    env:
      USE_FRAMEWORKS: static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-lockfiles
          path: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true
          working-directory: example
      - name: Select Xcode 26.5
        run: sudo xcode-select -s '/Applications/Xcode_26.5.app/Contents/Developer'
      - name: Refresh macOS lockfile
        working-directory: example
        run: bun pods:macos
      - name: Attach refreshed native lockfiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-lockfiles
          path: |
            example/macos/Podfile.lock
            example/Gemfile.lock
          retention-days: 1
      - name: Require committed native dependency resolutions
        run: |
          ruby scripts/ci-pod-lockfiles.rb example/macos/Podfile.lock
          git diff --exit-code -- example/Gemfile.lock
