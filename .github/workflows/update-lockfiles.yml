name: "Update Lockfiles (bun.lock + Podfile.lock)"

on:
  pull_request:
    branches:
      - main
    paths:
      - "example/package.json"
      - "packages/react-native-nitro-sqlite/package.json"

permissions:
  contents: write

jobs:
  update-lockfiles:
    name: "Update lockfiles (Podfile.lock)"
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: oven-sh/setup-bun@v2

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true
          working-directory: example/ios

      - name: Select Xcode 26.5
        run: sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"

      - run: |
          bun install

          cd example
          bundle install
          bun pods
          bun pods:macos
          cd ..

          git add bun.lock
          git add example/ios/Podfile.lock
          git add example/macos/Podfile.lock
          git add example/Gemfile.lock

          git config --global user.name 'dependabot[bot]'
          git config --global user.email 'dependabot[bot]@users.noreply.github.com'
          git commit --amend --no-edit
          git push --force
