name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact prepared version, such as 10.0.1 or 9.8.3"
        required: true
        type: string

permissions:
  contents: write
  # Both npm packages must trust margelo/react-native-nitro-sqlite's release.yml.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish packages and GitHub release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "An exact stable release version is required." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Test release preflight
        run: bun run test:release

      - name: Check trusted publishing for both packages
        run: |
          node --input-type=module <<'NODE'
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if (!requestUrl || !requestToken) {
            throw new Error('GitHub OIDC is unavailable to the release job')
          }

          const oidcUrl = new URL(requestUrl)
          oidcUrl.searchParams.set('audience', 'npm:registry.npmjs.org')
          for (const packageName of [
            'react-native-nitro-sqlite',
            'react-native-nitro-sqlite-vec',
          ]) {
            const oidcResponse = await fetch(oidcUrl, {
              headers: { Authorization: `Bearer ${requestToken}` },
            })
            if (!oidcResponse.ok) {
              throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`)
            }
            const { value: idToken } = await oidcResponse.json()
            if (!idToken) {
              throw new Error('GitHub OIDC response did not contain a token')
            }

            const exchangeUrl = new URL(
              `/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(packageName)}`,
              'https://registry.npmjs.org',
            )
            const response = await fetch(exchangeUrl, {
              method: 'POST',
              headers: { Authorization: `Bearer ${idToken}` },
            })
            if (!response.ok) {
              throw new Error(`${packageName}: npm OIDC exchange failed (${response.status})`)
            }
            const { token } = await response.json()
            if (!token) {
              throw new Error(`${packageName}: npm OIDC exchange returned no token`)
            }
            console.log(`${packageName}: npm trusted publishing is available`)
          }
          NODE

      - name: Generate release notes
        run: node scripts/generate-release-notes.ts "$RELEASE_VERSION" "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Publish prepared release
        run: ./scripts/release.sh --publish-prepared "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create GitHub release
        run: |
          version="$RELEASE_VERSION"
          latest=true
          if [[ "${version%%.*}" == 9 ]]; then
            latest=false
          fi
          gh release create "v${version}" --target "$(git rev-parse HEAD)" --title "NitroSQLite ${version}" --latest="$latest" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}

  build-android:
    needs: release
    uses: ./.github/workflows/build-android-release.yml
    with:
      tag: v${{ inputs.version }}
