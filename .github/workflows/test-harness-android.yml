name: Build and test Android

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      configuration:
        type: boolean
        default: false

permissions:
  contents: read

env:
  TARGET_ANDROID_ARCH: x86_64

jobs:
  test:
    name: Android integration tests, minSdk ${{ matrix.min_sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        min_sdk: ${{ fromJSON(inputs.full && '["24", "26"]' || '["24"]') }}
    steps:
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-lockfiles
          path: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Set minSdk in build.gradle
        run: sed -i "s/minSdkVersion = 24/minSdkVersion = ${{ matrix.min_sdk }}/g" example/android/build.gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: 17
          java-package: jdk

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-
      - name: Test Android SQLite build flags
        run: example/android/gradlew --project-dir scripts/android-sqlite-flags testSqliteFlags --no-daemon

      - name: Check Gradle configuration cache
        if: matrix.min_sdk == '24' && (inputs.full || inputs.configuration)
        working-directory: example/android
        run: |
          # React Native creates the autolinking file on the first run.
          ./gradlew :react-native-nitro-sqlite:help --configuration-cache --no-daemon
          ./gradlew :react-native-nitro-sqlite:help --configuration-cache --no-daemon
          ./gradlew :react-native-nitro-sqlite:help --configuration-cache --no-daemon | tee "$RUNNER_TEMP/nitro-sqlite-configuration-cache.log"
          grep -q 'Configuration cache entry reused' "$RUNNER_TEMP/nitro-sqlite-configuration-cache.log"

      - name: Build Android app
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ env.TARGET_ANDROID_ARCH }}

      - name: Run Android integration tests
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android
          projectRoot: example
          packageManager: bun
          cacheAvd: false
      - name: Stop Gradle Daemon
        if: always()
        working-directory: example/android
        run: ./gradlew --stop
