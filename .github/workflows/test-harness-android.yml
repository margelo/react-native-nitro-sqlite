name: Test Harness Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-harness-android.yml"
      - "example/android/**"
      - "example/src/tests/**"
      - "example/tests/**"
      - "example/rn-harness.config.mjs"
      - "example/jest.config.js"
      - "packages/react-native-nitro-sqlite/cpp/**"
      - "packages/react-native-nitro-sqlite/android/**"
      - "**/bun.lock"
      - "**/react-native.config.js"
      - "**/nitro.json"

env:
  TARGET_ANDROID_ARCH: x86_64

jobs:
  test:
    name: Harness Tests (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies (bun)
        run: bun install

      - name: Build Android app
        working-directory: example/android
        run: >-
          ./gradlew :app:assembleDebug --no-daemon
          -PreactNativeArchitectures=${{ env.TARGET_ANDROID_ARCH }}

      - name: Run react-native-harness on Android
        uses: callstackincubator/react-native-harness@v1.2.0
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android
          projectRoot: example
          packageManager: bun
          cacheAvd: false
