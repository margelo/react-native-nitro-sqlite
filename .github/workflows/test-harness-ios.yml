name: Test Harness iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-harness-ios.yml"
      - "example/ios/**"
      - "example/src/tests/**"
      - "example/tests/**"
      - "example/rn-harness.config.mjs"
      - "example/jest.config.js"
      - "packages/react-native-nitro-sqlite/cpp/**"
      - "packages/react-native-nitro-sqlite/ios/**"
      - "packages/react-native-nitro-sqlite/src/**"
      - "packages/react-native-nitro-sqlite/nitrogen/generated/shared/**"
      - "packages/react-native-nitro-sqlite/nitrogen/generated/ios/**"
      - "packages/react-native-nitro-sqlite-vec/cpp/**"
      - "packages/react-native-nitro-sqlite/RNNitroSQLite.podspec"
      - "packages/react-native-nitro-sqlite-vec/RNNitroSqliteVec.podspec"
      - "example/Gemfile.lock"
      - "bun.lock"
      - "package.json"
      - "example/package.json"
      - "packages/react-native-nitro-sqlite/package.json"
      - "packages/react-native-nitro-sqlite-vec/package.json"
      - "patches/react-native-nitro-modules*"
      - "example/react-native.config.js"
      - "packages/react-native-nitro-sqlite/react-native.config.js"
      - "packages/react-native-nitro-sqlite-vec/react-native.config.js"
      - "packages/react-native-nitro-sqlite/nitro.json"
      - "!packages/react-native-nitro-sqlite/src/__tests__/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Harness Tests (iOS)
    runs-on: macOS-26
    env:
      IOS_SIMULATOR_NAME: iPhone 17 Pro
      IOS_SIMULATOR_OS: "26.2"

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true
          working-directory: example

      - name: Select Xcode 26.2
        run: sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"

      - name: Start iOS simulator
        run: |
          set -euo pipefail

          simulator="$(xcrun simctl list devices available --json | node -e '
            const { readFileSync } = require("node:fs")
            const runtime = `com.apple.CoreSimulator.SimRuntime.iOS-${process.env.IOS_SIMULATOR_OS.replaceAll(".", "-")}`
            const devices = JSON.parse(readFileSync(0, "utf8")).devices[runtime] ?? []
            const device = devices.find((candidate) => candidate.name === process.env.IOS_SIMULATOR_NAME && candidate.isAvailable)
            if (!device) throw new Error(`Simulator ${process.env.IOS_SIMULATOR_NAME} on ${runtime} is unavailable`)
            console.log(`${device.udid} ${device.state}`)
          ')"
          read -r simulator_udid simulator_state <<< "$simulator"
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

          if [[ "$simulator_state" == "Shutdown" ]]; then
            xcrun simctl boot "$simulator_udid"
          fi

      - name: Install Pods
        working-directory: example
        run: bun pods

      - name: Build debug app
        working-directory: example/ios
        run: |
          set -euo pipefail

          xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroSQLiteExample.xcworkspace \
            -scheme NitroSQLiteExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Wait for iOS simulator
        timeout-minutes: 10
        run: xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b

      - name: Run react-native-harness on iOS
        uses: callstackincubator/react-native-harness@v1.5.0
        env:
          HARNESS_DEBUG: "1"
        with:
          app: ios/build/Build/Products/Debug-iphonesimulator/NitroSQLiteExample.app
          runner: ios
          projectRoot: example
          packageManager: bun
