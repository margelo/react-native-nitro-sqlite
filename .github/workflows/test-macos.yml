name: Test macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-macos.yml"
      - "example/macos/**"
      - "example/src/**"
      - "example/tests/**"
      - "example/app.json"
      - "example/index.js"
      - "example/babel.config*.js"
      - "packages/react-native-nitro-sqlite/**"
      - "packages/react-native-nitro-sqlite-vec/**"
      - "patches/**"
      - "**/Podfile.lock"
      - "**/Gemfile.lock"
      - "**/bun.lock"
      - "**/package.json"
      - "**/react-native.config.js"
      - "**/nitro.json"

jobs:
  test:
    name: macOS Integration Tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true
          working-directory: example

      - name: Select Xcode 26.5
        run: sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"

      - name: Install Pods
        run: bun --cwd example pods:macos

      - name: Build debug app
        working-directory: example/macos
        run: |
          set -euo pipefail
          xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroSQLiteExample.xcworkspace \
            -scheme NitroSQLiteExample-macOS \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run macOS integration tests
        working-directory: example/macos
        run: bun run test
