name: Lint TypeScript

permissions:
  checks: write
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths: &typescript_paths
      - ".github/workflows/lint-typescript.yml"
      - ".prettierrc.js"
      - "config/**"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "example/**/*.ts"
      - "example/**/*.tsx"
      - "example/**/*.js"
      - "example/**/*.jsx"
      - "example/**/*.mjs"
      - "example/tsconfig.json"
      - "example/app.json"
      - "example/package.json"
      - "example/macos/package.json"
      - "packages/react-native-nitro-sqlite/**/*.ts"
      - "packages/react-native-nitro-sqlite/**/*.tsx"
      - "packages/react-native-nitro-sqlite/**/*.js"
      - "packages/react-native-nitro-sqlite/**/*.jsx"
      - "packages/react-native-nitro-sqlite/tsconfig.json"
      - "packages/react-native-nitro-sqlite/tsconfig.build.json"
      - "packages/react-native-nitro-sqlite/package.json"
      - "packages/react-native-nitro-sqlite/nitro.json"
      - "packages/react-native-nitro-sqlite-vec/**/*.ts"
      - "packages/react-native-nitro-sqlite-vec/**/*.tsx"
      - "packages/react-native-nitro-sqlite-vec/**/*.js"
      - "packages/react-native-nitro-sqlite-vec/**/*.jsx"
      - "packages/react-native-nitro-sqlite-vec/tsconfig.json"
      - "packages/react-native-nitro-sqlite-vec/package.json"
  pull_request:
    paths: *typescript_paths

jobs:
  tsc:
    name: Compile TypeScript (tsc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: reviewdog/action-setup@v1

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Run TypeScript (tsc)
        run: |
          set -o pipefail
          bun typecheck | reviewdog -name="tsc" -efm="%f(%l,%c): error TS%n: %m" -reporter="github-pr-review" -filter-mode="nofilter" -fail-level=error -tee
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint and test TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Run ESLint with auto-fix in example
        working-directory: example
        run: bun lint
      - name: Run ESLint with auto-fix in react-native-nitro-sqlite
        working-directory: packages/react-native-nitro-sqlite
        run: bun lint

      - name: Verify no files have changed after auto-fix
        run: git diff --exit-code HEAD -- . ':(exclude)bun.lock'

      - name: Test core JavaScript wrappers
        working-directory: packages/react-native-nitro-sqlite
        run: ../../node_modules/.bin/jest --coverage --runInBand

      - name: Test sqlite-vec helpers
        working-directory: packages/react-native-nitro-sqlite-vec
        run: ../../node_modules/.bin/jest --coverage --runInBand

      - name: Test the in-app Mocha runner
        working-directory: example
        run: ../node_modules/.bin/jest --config jest.mocha.config.js --runInBand --watchman=false
