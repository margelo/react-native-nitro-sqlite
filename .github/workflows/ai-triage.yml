name: AI triage

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request == null &&
        github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target runs with a write token. Never check out PR code here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Label and triage
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/ai-triage.mjs
