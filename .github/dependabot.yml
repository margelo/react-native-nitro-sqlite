version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'ecosystem:github-actions'

  - package-ecosystem: 'gradle'
    directories:
      - '/packages/react-native-nitro-sqlite/android/'
      - '/example/android/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'ecosystem:gradle'
    # Update the example wrapper with its React Native Android toolchain.
    ignore:
      - dependency-name: 'gradle-wrapper'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']

  - package-ecosystem: 'npm'
    directories:
      - '/packages/react-native-nitro-sqlite/'
      - '/example/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'ecosystem:npm'
    # Update the React Native, React, and CLI versions together; allow security updates.
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-test-renderer'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@react-native-community/cli*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@types/react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react-test-renderer'
        update-types:
          - 'version-update:semver-major'
    groups:
      babel:
        patterns:
          - '@babel/*'
