version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'

  - package-ecosystem: 'gradle'
    directories:
      - '/packages/react-native-nitro-sqlite/android/'
      - '/example/android/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'kotlin'

  - package-ecosystem: 'npm'
    directories:
      - '/packages/react-native-nitro-sqlite/'
      - '/example/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'typescript'
    groups:
      rncli:
        patterns:
          - '@react-native-community/cli*'
      babel:
        patterns:
          - '@babel/*'
      rn:
        patterns:
          - '@react-native/*'
