version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'ecosystem:github-actions'
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'gradle'
    directories:
      - '/packages/react-native-nitro-sqlite/android/'
      - '/example/android/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'ecosystem:gradle'
    groups:
      gradle:
        patterns: ['*']
        update-types: ['minor', 'patch']
        group-by: 'dependency-name'
    # Update the example wrapper with its React Native Android toolchain.
    ignore:
      - dependency-name: 'gradle-wrapper'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']

  - package-ecosystem: 'npm'
    directories:
      - '/packages/react-native-nitro-sqlite/'
      - '/example/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'ecosystem:npm'
    # Update the React Native, React, and CLI versions together; allow security updates.
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-test-renderer'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@react-native-community/cli*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@types/react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react-test-renderer'
        update-types:
          - 'version-update:semver-major'
      # Review Babel majors with React Native's Babel preset.
      - dependency-name: '@babel/*'
        update-types:
          - 'version-update:semver-major'
      # Review Expo runtime requirements before upgrading expo-status-bar majors.
      - dependency-name: 'expo-status-bar'
        update-types:
          - 'version-update:semver-major'
    groups:
      babel:
        patterns:
          - '@babel/*'
        update-types: ['minor', 'patch']
      development:
        patterns:
          - '@types/*'
          - '*jest*'
          - '*eslint*'
          - 'typescript*'
          - 'prettier'
        update-types: ['minor', 'patch']
      shared-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
        group-by: 'dependency-name'
